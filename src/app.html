<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #14001f;
				font-family: 'Neuton', serif;
			}

			#startup-loader {
				position: fixed;
				inset: 0;
				background-color: #14001f;
				z-index: 9999999;
			}

			.startup-bg {
				position: absolute;
				inset: 0;
				overflow: hidden;
			}

			.startup-bg::before {
				content: '';
				position: absolute;
				left: 50%;
				top: 50%;
				--cover: calc(100vw / 960);
				width: calc(540px * var(--cover));
				height: calc(960px * var(--cover));
				background-image: url('%sveltekit.assets%/assets/sprites/ui-0.png');
				background-repeat: no-repeat;
				background-size: calc(2033px * var(--cover)) calc(2039px * var(--cover));
				background-position: calc(-1186px * var(--cover)) calc(-963px * var(--cover));
				transform: translate(-50%, -50%) rotate(-90deg);
				transform-origin: center;
			}

			@supports (width: max(1px, 2px)) {
				.startup-bg::before {
					--cover: max(calc(100vw / 960), calc(100vh / 540));
				}
			}

			.startup-bg::after {
				content: '';
				position: absolute;
				inset: 0;
				background: rgba(0, 0, 0, 0.15);
			}
		</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<div id="startup-loader">
			<div class="startup-bg" aria-hidden="true"></div>
		</div>
		<div>%sveltekit.body%</div>
	</body>
</html>
