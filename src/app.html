<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #14001f;
				font-family: 'Neuton', serif;
			}

			#startup-loader {
				position: fixed;
				inset: 0;
				background-color: #14001f;
				z-index: 9999999;
				display: grid;
				place-items: center;
				isolation: isolate;
			}

			.startup-bg {
				position: absolute;
				inset: 0;

				background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/gameloaderBg.png');
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;

				filter: saturate(1.05) contrast(1.05);
			}

			/* ========================= */
			/* MAIN LOADER UI */
			/* ========================= */

			.startup-ui {
				position: relative;
				z-index: 1;

				width: min(620px, 84vw);

				display: grid;
				gap: 12px;

				justify-items: center;
				align-self: end;

				margin-bottom: 11vh;

				pointer-events: none;

				--startup-progress: 0%;
			}

			/* ========================= */
			/* LOADING TEXT */
			/* ========================= */

			.startup-progress-text {
				color: #ffffff;

				font-family: 'Cinzel', serif;
				font-weight: 800;

				letter-spacing: 0.18em;
				text-transform: uppercase;

				font-size: clamp(15px, 2.5vw, 20px);

				text-shadow:
					0 0 10px rgba(255, 215, 120, 0.45),
					0 2px 12px rgba(0, 0, 0, 0.8);

				animation: textGlow 2s ease-in-out infinite;
			}

			/* ========================= */
			/* TRACK */
			/* ========================= */

			.startup-progress-track {
				position: relative;

				width: 100%;
				height: 34px;

				padding: 3px;

				border-radius: 9px;

				background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.35));

				border: 1px solid rgba(255, 230, 160, 0.45);

				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.08) inset,
					0 8px 24px rgba(0, 0, 0, 0.45),
					0 0 24px rgba(255, 196, 64, 0.18);

				backdrop-filter: blur(3px);

				overflow: hidden;
			}

			/* glowing pulse around track */
			.startup-progress-track::after {
				content: '';

				position: absolute;
				inset: -2px;

				border-radius: inherit;

				background: linear-gradient(
					90deg,
					rgba(255, 0, 0, 0.12),
					rgba(255, 255, 255, 0.08),
					rgba(0, 70, 255, 0.12)
				);

				filter: blur(10px);

				opacity: 0.7;

				animation: trackPulse 2.5s ease-in-out infinite;
			}

			/* ========================= */
			/* FILL */
			/* ========================= */

			.startup-progress-fill {
				position: relative;

				height: 100%;
				width: var(--startup-progress);

				border-radius: 9px;
background: linear-gradient(
    90deg,
    #7a5214 0%,    /* Deep golden shadow */
    #c69320 25%,   /* Rich mid-gold */
    #fce38a 50%,   /* Bright center highlight (the "shine") */
    #c69320 75%,   /* Return to mid-gold */
    #9b6b16 100%   /* Dark edge */
);
				box-shadow:
					0 0 14px rgba(255, 214, 102, 0.55),
					0 0 28px rgba(255, 214, 102, 0.35);

				transition: width 160ms linear;

				overflow: hidden;
			}

			/* glossy highlight */
			.startup-progress-fill::after {
				content: '';

				position: absolute;
				inset: 0;

				border-radius: inherit;

				background: linear-gradient(
					180deg,
					rgba(255, 255, 255, 0.48),
					rgba(255, 255, 255, 0.08) 45%,
					transparent 100%
				);
			}

			/* moving shine effect */
			.startup-progress-fill::before {
				content: '';

				position: absolute;
				top: 0;
				left: -35%;

				width: 35%;
				height: 100%;

				background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);

				transform: skewX(-20deg);

				animation: shine 1.8s linear infinite;
			}

			/* ========================= */
			/* MOBILE */
			/* ========================= */

			@media (orientation: portrait) {
				.startup-bg {
					background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/bgLoadingMobile.png');
				}

				.startup-ui {
					width: 88vw;
					margin-bottom: 10vh;
				}

				.startup-progress-track {
					height: 16px;
				}

				.startup-progress-text {
					font-size: 13px;
				}
			}

			/* ========================= */
			/* ANIMATIONS */
			/* ========================= */

			@keyframes shine {
				0% {
					left: -35%;
				}

				100% {
					left: 135%;
				}
			}

			@keyframes textGlow {
				0%,
				100% {
					opacity: 0.9;
				}

				50% {
					opacity: 1;
				}
			}

			@keyframes trackPulse {
				0%,
				100% {
					opacity: 0.45;
				}

				50% {
					opacity: 0.85;
				}
			}
			@media (orientation: portrait) {
				.startup-bg {
					background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/bgLoadingMobile.png');
				}
			}
		</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<div id="startup-loader">
			<div class="startup-bg" aria-hidden="true"></div>
			<div class="startup-ui" aria-label="Loading">
				<div class="startup-progress-text" data-startup-progress-text>Loading 0%</div>
				<div class="startup-progress-track" aria-hidden="true">
					<div class="startup-progress-fill"></div>
				</div>
			</div>
		</div>
		<script>
			(() => {
				const loader = document.getElementById('startup-loader');
				if (!loader) return;
				const ui = loader.querySelector('.startup-ui');
				const fill = loader.querySelector('.startup-progress-fill');
				const text = loader.querySelector('[data-startup-progress-text]');

				const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
				const setProgress = (value) => {
					const percent = clamp(Math.round(Number(value) || 0), 0, 100);
					if (ui) ui.style.setProperty('--startup-progress', `${percent}%`);
					if (fill) fill.style.width = `${percent}%`;
					if (text) text.textContent = `Loading ${percent}%`;
				};

				window.__setStartupLoaderProgress = setProgress;
				setProgress(0);
			})();
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
