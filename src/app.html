<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #14001f;
				font-family: 'Neuton', serif;
			}

			/* HTML startup loader */
			#startup-loader {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: radial-gradient(circle at center, #2b003d 0%, #14001f 70%);
				z-index: 9999999;
			}

			.loader-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 24px;
			}

			.startup-spinner {
				width: 90px;
				height: 90px;
				border-radius: 50%;
				border: 8px solid rgba(255, 255, 255, 0.12);
				border-top: 8px solid #ffffff;
				animation: startup-spin 0.9s linear infinite;
				box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
			}

			.loading-text {
				color: white;
				font-size: 32px;
				font-weight: 800;
				letter-spacing: 6px;
				animation: pulseText 1s ease-in-out infinite;
			}

			@keyframes startup-spin {
				100% {
					transform: rotate(360deg);
				}
			}

			@keyframes pulseText {
				0%,
				100% {
					opacity: 0.4;
					transform: scale(1);
				}

				50% {
					opacity: 1;
					transform: scale(1.05);
				}
			}
		</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<!-- INITIAL HTML LOADER -->
		<div id="startup-loader">
			<div class="loader-wrap">
				<div class="startup-spinner"></div>
				<div class="loading-text">LOADING...</div>
			</div>
		</div>

		<div>%sveltekit.body%</div>
	</body>
</html>
