<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

		<style>
	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background-color: #14001f;
		font-family: 'Neuton', serif;
	}

	#startup-loader {
		position: fixed;
		inset: 0;
		background-color: #14001f;
		z-index: 9999999;
		display: grid;
		place-items: center;
		isolation: isolate;
	}

	/* ========================= */
	/* BACKGROUND */
	/* ========================= */

	.startup-bg {
		position: absolute;
		inset: 0;

		background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/gameloaderBg.png');
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;

		filter: saturate(1.05) contrast(1.05);
	}

	/* ========================= */
	/* MAIN UI */
	/* ========================= */

	.startup-ui {
		position: relative;
		z-index: 1;

		width: min(620px, 84vw);

		display: grid;
		gap: 14px;

		justify-items: center;
		align-self: end;

		margin-bottom: 11vh;

		pointer-events: none;

		--startup-progress: 0%;
	}

	/* ========================= */
	/* LOADING TEXT */
	/* ========================= */

	.startup-progress-text {
		color: #ffe7a3;

		font-family: 'Cinzel', serif;
		font-weight: 800;

		letter-spacing: 0.18em;
		text-transform: uppercase;

		font-size: clamp(15px, 2.5vw, 20px);

		text-shadow:
			0 0 8px rgba(255,215,120,0.35),
			0 2px 8px rgba(0,0,0,0.85);

		animation: textGlow 2s ease-in-out infinite;
	}

	/* ========================= */
	/* TRACK */
	/* ========================= */

	.startup-progress-track {
		position: relative;

		width: 100%;
		height: 34px;

		padding: 4px;

		border-radius: 10px;

		background: linear-gradient(
			180deg,
			#2a1d0f 0%,
			#3b2a17 100%
		);

		border: 3px solid #c89b3c;

		box-shadow:
			0 0 0 1px rgba(255,255,255,0.06) inset,
			0 8px 24px rgba(0,0,0,0.5),
			0 0 18px rgba(255,196,64,0.22);

		overflow: hidden;
	}

	/* soft outer glow */

	.startup-progress-track::after {
		content: '';

		position: absolute;
		inset: -3px;

		border-radius: inherit;

		background: rgba(255, 211, 77, 0.12);

		filter: blur(12px);

		opacity: 0.7;

		z-index: -1;

		animation: trackPulse 2.5s ease-in-out infinite;
	}

	/* ========================= */
	/* FILL */
	/* ========================= */

	.startup-progress-fill {
		position: relative;

		height: 100%;
		width: var(--startup-progress);

		border-radius: 6px;

		background: linear-gradient(
			90deg,
			#6e4b12 0%,
			#b8860b 30%,
			#ffd34d 60%,
			#fff0b3 100%
		);

		box-shadow:
			0 0 12px rgba(255, 211, 77, 0.45),
			0 0 22px rgba(255, 211, 77, 0.25);

		transition: width 160ms linear;

		overflow: hidden;
	}

	/* moving shine */

	.startup-progress-fill::before {
		content: '';

		position: absolute;
		top: 0;
		left: -35%;

		width: 35%;
		height: 100%;

		background: linear-gradient(
			90deg,
			transparent,
			rgba(255,255,255,0.45),
			transparent
		);

		transform: skewX(-20deg);

		animation: shine 1.8s linear infinite;
	}

	/* ========================= */
	/* MOBILE */
	/* ========================= */

	@media (orientation: portrait) {
		.startup-bg {
			background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/bgLoadingMobile.png');
		}

		.startup-ui {
			width: 88vw;
			margin-bottom: 10vh;
		}

		.startup-progress-track {
			height: 28px;
		}

		.startup-progress-text {
			font-size: 13px;
		}
	}

	/* ========================= */
	/* ANIMATIONS */
	/* ========================= */

	@keyframes shine {
		0% {
			left: -35%;
		}

		100% {
			left: 135%;
		}
	}

	@keyframes textGlow {
		0%,
		100% {
			opacity: 0.9;
		}

		50% {
			opacity: 1;
		}
	}

	@keyframes trackPulse {
		0%,
		100% {
			opacity: 0.45;
		}

		50% {
			opacity: 0.85;
		}
	}
</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<div id="startup-loader">
			<div class="startup-bg" aria-hidden="true"></div>
			<div class="startup-ui" aria-label="Loading">
				<div class="startup-progress-text" data-startup-progress-text>Loading 0%</div>
				<div class="startup-progress-track" aria-hidden="true">
					<div class="startup-progress-fill"></div>
				</div>
			</div>
		</div>
		<script>
			(() => {
				const loader = document.getElementById('startup-loader');
				if (!loader) return;
				const ui = loader.querySelector('.startup-ui');
				const fill = loader.querySelector('.startup-progress-fill');
				const text = loader.querySelector('[data-startup-progress-text]');

				const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
				const setProgress = (value) => {
					const percent = clamp(Math.round(Number(value) || 0), 0, 100);
					if (ui) ui.style.setProperty('--startup-progress', `${percent}%`);
					if (fill) fill.style.width = `${percent}%`;
					if (text) text.textContent = `Loading ${percent}%`;
				};

				window.__setStartupLoaderProgress = setProgress;
				setProgress(0);
			})();
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
