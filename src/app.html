<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #14001f;
				font-family: 'Neuton', serif;
			}

			#startup-loader {
				position: fixed;
				inset: 0;
				background-color: #14001f;
				z-index: 9999999;
				display: grid;
				place-items: center;
				isolation: isolate;
			}

			.startup-bg {
				position: absolute;
				inset: 0;
				background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/gameloaderBg.png');
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
				filter: saturate(1.05) contrast(1.05);
			}

			@media (orientation: portrait) {
				.startup-bg {
					background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/bgLoadingMobile.png');
				}
			}
		</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<div id="startup-loader">
			<div class="startup-bg" aria-hidden="true"></div>
		</div>
		<div>%sveltekit.body%</div>
	</body>
</html>
