<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Neuton font -->
		<link
			href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap"
			rel="stylesheet"
		/>

<style>
	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background-color: #14001f;
		font-family: 'Neuton', serif;
	}

	#startup-loader {
		position: fixed;
		inset: 0;
		background-color: #14001f;
		z-index: 9999999;
		display: grid;
		place-items: center;
		isolation: isolate;
	}

	/* ========================= */
	/* BACKGROUND */
	/* ========================= */

	.startup-bg {
		position: absolute;
		inset: 0;

		background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/gameloaderBg.webp');
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;

		filter: saturate(1.05) contrast(1.05);
	}

	/* ========================= */
	/* MAIN UI */
	/* ========================= */

	.startup-ui {
		position: relative;
		z-index: 1;

		width: min(620px, 84vw);

		display: grid;
		gap: 16px;

		justify-items: center;
		align-self: end;

		margin-bottom: 11vh;

		pointer-events: none;

		--startup-progress: 0%;
	}

	/* ========================= */
	/* LOADING TEXT */
	/* ========================= */

	.startup-progress-text {
		color: #f8f3e7;

		font-family: 'Cinzel', serif;
		font-weight: 800;

		letter-spacing: 0.14em;
		text-transform: uppercase;

		font-size: clamp(16px, 2.2vw, 22px);

		text-shadow:
			0 2px 0 rgba(120, 80, 20, 0.9),
			0 0 10px rgba(255, 220, 120, 0.45),
			0 4px 18px rgba(0, 0, 0, 0.8);

		animation: textGlow 2s ease-in-out infinite;
	}

	/* ========================= */
	/* TRACK */
	/* ========================= */

	
	/* ========================= */
	/* MOBILE */
	/* ========================= */

	@media (orientation: portrait) {
		.startup-bg {
			background-image: url('%sveltekit.assets%/assets/sprites/symbolsStatic/bgLoadingMobile.webp');
		}

		.startup-ui {
			width: 88vw;
			margin-bottom: 10vh;
		}


	}

	/* ========================= */
	/* ANIMATIONS */
	/* ========================= */

	@keyframes shine {
		0% {
			left: -35%;
		}

		100% {
			left: 135%;
		}
	}

	@keyframes textGlow {
		0%,
		100% {
			opacity: 0.9;
		}

		50% {
			opacity: 1;
		}
	}
</style>

		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>

	<body>
		<div id="startup-loader">
			<div class="startup-bg" aria-hidden="true"></div>
			<div class="startup-ui" aria-label="Loading">
				<div class="startup-progress-text" data-startup-progress-text>Loading 0%</div>
				<div class="startup-progress-track" aria-hidden="true">
					<div class="startup-progress-fill"></div>
				</div>
			</div>
		</div>
		<script>
			(() => {
				const loader = document.getElementById('startup-loader');
				if (!loader) return;
				const ui = loader.querySelector('.startup-ui');
				const fill = loader.querySelector('.startup-progress-fill');
				const text = loader.querySelector('[data-startup-progress-text]');

				const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
				const setProgress = (value) => {
					const percent = clamp(Math.round(Number(value) || 0), 0, 100);
					if (ui) ui.style.setProperty('--startup-progress', `${percent}%`);
					if (fill) fill.style.width = `${percent}%`;
					if (text) text.textContent = `Loading ${percent}%`;
				};

				window.__setStartupLoaderProgress = setProgress;
				setProgress(0);
			})();
		</script>
		<div>%sveltekit.body%</div>
	</body>
</html>
